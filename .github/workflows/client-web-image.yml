# Builds the client container (container/Dockerfile, see CLIENT_CONTAINER.md) and
# pushes it to ghcr.io/dennisfarmer/superconductor:client-web, on every push to
# client-web. GitHub's runners are x86_64, so linux/amd64 builds natively.
#
# The describe server and the MIDI player come from their own branches as they are.
# After those branches change, push to client-web to rebuild (an empty commit does it).
name: client-web image

on:
  push:
    branches: [client-web]

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: client
      - uses: actions/checkout@v4
        with:
          ref: describe
          path: describe
      - uses: actions/checkout@v4
        with:
          ref: midi_experiment_dennis
          path: midi
      - uses: actions/checkout@v4
        with:
          ref: atlas
          path: atlas

      # torch, CUDA wheels and the baked models need more room than the runner has free
      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL

      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: client
          file: client/container/Dockerfile
          platforms: linux/amd64
          build-contexts: |
            describe=describe
            midi=midi
            atlas=atlas
          push: true
          tags: ghcr.io/dennisfarmer/superconductor:client-web
          cache-from: type=gha
          cache-to: type=gha,mode=max
