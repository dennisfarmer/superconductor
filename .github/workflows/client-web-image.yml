# Builds the client container (client_container/Dockerfile, see client_container/README.md)
# and pushes the linux/amd64 image to ghcr.io/dennisfarmer/superconductor:client-web.
# GitHub's runners are x86_64, so that build is native. lh2300 turns it into a
# Singularity image:
#   singularity pull docker://ghcr.io/dennisfarmer/superconductor:client-web
# (`make sif` does this.)
#
# The Docker context is the client branch. tracking, conducting, describe and
# midi are inside superconductor_client/. Atlas still comes from its own branch.
# It only runs by hand: anyone with write access presses "Run workflow" on the
# repo's Actions tab (pushes don't trigger it). GitHub only shows that
# button for workflows on the default branch (client), and this workflow checks
# out client.
#
# ghcr.io keeps only the current image: each build moves the tag, and the old image,
# now untagged, is deleted. Provenance and SBOM are off so the tag is one plain
# manifest; with them on, the tag points at untagged child manifests that the
# cleanup would delete, breaking the image.
name: client-web image

on:
  workflow_dispatch:

# one build at a time; a second press waits instead of racing the first
concurrency:
  group: client-web-image
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: client
          path: client
      - uses: actions/checkout@v4
        with:
          ref: atlas
          path: atlas

      # torch, CUDA wheels and the baked models need more room than the runner has free
      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL

      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: client
          file: client/client_container/Dockerfile
          platforms: linux/amd64
          build-contexts: |
            atlas=atlas
          push: true
          tags: ghcr.io/dennisfarmer/superconductor:client-web
          provenance: false
          sbom: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - uses: actions/delete-package-versions@v5
        with:
          package-name: superconductor
          package-type: container
          min-versions-to-keep: 0
          delete-only-untagged-versions: 'true'
