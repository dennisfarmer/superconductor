# Builds the client container (container/Dockerfile, see CLIENT_CONTAINER.md) and
# pushes it to ghcr.io/dennisfarmer/superconductor:client-web, on every push to
# client-web. GitHub's runners are x86_64, so linux/amd64 builds natively.
#
# The describe server and the MIDI player come from their own branches as they are.
# To rebuild without pushing (e.g. after those branches change), anyone with write
# access can press "Run workflow" on the repo's Actions tab. GitHub only shows that
# button for workflows on the default branch (client), so this file lives on both
# client and client-web, and it always builds client-web whichever branch runs it.
#
# ghcr.io keeps only the current image: each push moves the tag, and the old image,
# now untagged, is deleted. Provenance and SBOM are off so the tag is one plain
# manifest; with them on, the tag points at untagged child manifests that the
# cleanup would delete, breaking the image.
name: client-web image

on:
  push:
    branches: [client-web]
  workflow_dispatch:

# one build at a time; a second press waits instead of racing the first
concurrency:
  group: client-web-image
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: client-web
          path: client
      - uses: actions/checkout@v4
        with:
          ref: describe
          path: describe
      - uses: actions/checkout@v4
        with:
          ref: midi_experiment_dennis
          path: midi
      - uses: actions/checkout@v4
        with:
          ref: atlas
          path: atlas

      # torch, CUDA wheels and the baked models need more room than the runner has free
      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL

      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: client
          file: client/container/Dockerfile
          platforms: linux/amd64
          build-contexts: |
            describe=describe
            midi=midi
            atlas=atlas
          push: true
          tags: ghcr.io/dennisfarmer/superconductor:client-web
          provenance: false
          sbom: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - uses: actions/delete-package-versions@v5
        with:
          package-name: superconductor
          package-type: container
          min-versions-to-keep: 0
          delete-only-untagged-versions: 'true'
