# Where the music server and the client are. Copied from superconductor_client.
# Both run on the cluster, and the SSH tunnel puts them on this computer's
# localhost (superconductor_client README). Running them on this computer uses
# the same ports, so there is one entry each.

# The music server: the Playback app opens `playback` and reads tempo from `http`.
[server]
input = "ws://localhost:9000/stream/input"
playback = "ws://localhost:9000/stream/playback"
http = "http://localhost:9000"

# What this computer opens for tracking and conducting.
[client]
tracking = "ws://localhost:9100/ws/tracking"
hands = "ws://localhost:9102/ws/hands/monitor"
tracking_page = "http://localhost:9100/?audio=monitor"
conduct_page = "http://localhost:9102"
