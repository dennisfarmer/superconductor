# SuperConductor collaborative mode: physical objects -> Magenta RealTime 2 parameters
# run with: sc-tracking   (or: sc-tracking --config path/to/other.toml)
# make client starts this together with the client, conducting, and midi.
# The describe server is separate (`make describe`, or `make client DESCRIBE=1`).

[camera]
name = "C920"                 # Logitech HD Pro Webcam C920; substring of the macOS camera name
resolution = [1280, 720]

[music]
# Which block of superconductor_client/addresses.toml. make client uses local;
# make client-remote passes --where remote. The addresses themselves are not here.
where = "local"
base_prompt = "ambient electronic"
base_weight = 0.3             # style weight that is always present
credits = 3                   # blocks the server stays ahead of playback (~latency: 3 x 200ms)
update_interval = 0.25        # seconds between recipe / control updates
midi_port = 8470              # client_midi: other programs (e.g. SuperConductor Atlas) POST NOTES / DRUMS
                              # patterns here, forwarded to the server (0 = off)

[tracking]
# "unsupervised": every object gets a permanent id when it first appears and is
#   cached in the library, so it is recognized again later (also after a restart).
#   Name it and set its instrument on the objects page (http://localhost:8467/objects).
# "calibration": "touch the <label>" for each [assign] label at startup (see the end
#   of this file); only those are tracked.
mode = "unsupervised"
# Class-agnostic by default: a generic YOLOE prompt only has to *find* objects;
# each object's identity comes from its appearance (see object_tracking/identity.py).
# Specific prompts also work ("green plush toy"), and yoloe-11l-seg.pt is more
# accurate but ~3x slower (competes with MRT2 for the GPU).
# Add "hand" to classes to let hands claim parameters too.
model = "yoloe-11s-seg.pt"
classes = ["stuffed toy", "toy", "hand"]   # "hand" detections: calibration and "held" triggers
conf = 0.1                    # YOLOE's detection threshold; BoT-SORT starts tracks at new_track_thresh (botsort_superconductor.yaml)
imgsz = 480
device = "cpu"                # "cpu" leaves the GPU to MRT2
# identities (and a crop image of each) persist here across sessions; set "label"
# in identities.json to name an object, then link the label to a parameter in [assign]
identity_dir = "var/identities"   # superconductor_client/tracking/var/identities; calibration mode only
# appearance model used to recognize each object when it first appears or comes
# back (and to re-check it about once a second): DINOv2 ViT-S/14, at most
# embeds_per_frame crops per frame. On a Mac this uses MPS. On Linux the client
# stays on CPU so it does not take the L40S from the music server.
# "yolo11n-cls.pt" (embed_imgsz 128) is the older, weaker option. Remove to use
# color histograms only.
embedder = "dinov2_vits14"
embed_imgsz = 224
embeds_per_frame = 2
# every object seen: superconductor_client/tracking/library/<id>/ (object.json with name, description
# and instrument; views/*.jpg; embeddings.npy). Edit them on the objects page.
library_dir = "library"          # relative to superconductor_client/tracking/

[identity]
# score = cosine similarity of DINOv2 embeddings to an object's saved views (0..1)
match_threshold = 0.55        # a reappearing object is re-attached to a known one above this
new_threshold = 0.45          # ... and becomes a new object below this (ambiguous in between)
min_hits = 8                  # frames of evidence before deciding who a new track is
max_hits = 45                 # ambiguous tracks are decided anyway after this many frames
coast_seconds = 1.0           # a vanished object keeps its last box this long...
coast_near = 0.06             # ...or as long as it is this close to a detected object (objects together)
# reference views each object keeps (see and delete them, or freeze learning, by clicking
# an object's picture on the objects page)
gallery_size = 12             # views kept per object; over this, the most redundant one is dropped
novelty = 0.85                # a view is learned only if it is less similar than this to every kept view...
learn_threshold = 0.65        # ...and at least this similar to the closest one (else: likely another object)

[describe]
# describe server (superconductor_client/describe/, `make describe`): a Qwen VLM writes a
# one-time description of each new object and suggests an instrument from it.
# POST /svg draws an icon for a parameter prompt (SVGen: mlx-lm on macOS, transformers
# on the cluster; the weights load on the first icon).
server_url = "http://localhost:9200"

[web]
port = 8467                   # the camera page http://localhost:8467/ and the objects page /objects
detection = "auto"            # where YOLOE + BoT-SORT run: "auto" (the browser if it has WebGPU, else
                              # this process), "browser" or "container" (this process)
web_dir = "var/web"           # superconductor_client/tracking/var/web: ort/ (make web-deps), models/ (make web-model)

[services]
# other SuperConductor programs, listed (with whether they're up) on the objects page's Services tab
midi_player_url = "http://localhost:8475"   # superconductor_client/midi/, `make player`
# Atlas: tried first; if it is on another port (8764 in use), the running Atlas is found anyway
atlas_url = "http://localhost:8764"         # ../superconductor_atlas app, `make run`
atlas_engine_url = "http://localhost:8765"  # its audio engine (control API)

[mapping]
reference = [0.5, 0.5]        # normalized, as displayed (mirrored); click in the window to move
max_distance = 0.6            # distance (fraction of frame) at which influence reaches 0
smoothing = 0.3
hold_seconds = 1.5            # keep value while an object is occluded, then fade out
# release_after = 30.0        # free an object's parameter after this long unseen (default: never)

# Instruments, triggers (near / held / visible) and combos are set per object on
# the objects page (http://localhost:8467/objects) and saved in superconductor_client/tracking/library/. An object
# without an instrument is silent until the describe server suggests one.
#
# Calibration mode only ("touch the ..."): add [[parameters]] (name, kind, prompt)
# and [assign] (label = "<parameter name>"); the app asks you to touch each label.
