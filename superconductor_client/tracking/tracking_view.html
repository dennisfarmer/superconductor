<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Superconductor - Prompts (MusicCoCa)</title>
<style>
  :root {
    --bg: #f6f6f4; --card: #ffffff; --text: #1d1d1b; --muted: #6b6b66; --line: #deded8;
    --accent: #2f6fdb; --live: #1f9d55; --danger: #c2412d; --field: #fbfbf9;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #161615; --card: #20201e; --text: #ececea; --muted: #9a9a94; --line: #34342f;
      --accent: #6c9cf0; --live: #4cc47f; --danger: #ef7a62; --field: #1a1a18;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 15px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
  header { padding: 20px 16px 8px; max-width: 1100px; margin: 0 auto;
           display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
  h1 { font-size: 20px; margin: 0; }
  #status { color: var(--muted); font-size: 13px; }
  .grid { max-width: 1100px; margin: 0 auto; padding: 8px 16px 40px;
          display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 14px; }
  .grid[hidden] { display: none; }
  /* every parameter block, including "Add new parameter", is the same size */
  #parameters { grid-auto-rows: 312px; }
  #parameters > .card, #parameters > .add-tile { height: 100%; min-width: 0; }
  .thumb.icon { object-fit: contain; padding: 8px; background: var(--field); }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 14px;
          display: grid; grid-template-columns: 96px 1fr; gap: 12px; }
  .card.away { opacity: .72; }
  .card { position: relative; }
  .swatch { position: absolute; top: 10px; right: 10px; width: 22px; height: 22px; padding: 0;
            border-radius: 50%; border: 2px solid var(--card); box-shadow: 0 0 0 1px var(--line); cursor: pointer; }
  .swatch:hover { box-shadow: 0 0 0 2px var(--accent); }
  .swatch:disabled { cursor: default; pointer-events: none; }
  .swatch.none { background: transparent; border: 1px dashed var(--muted); box-shadow: none; }
  .picker { position: absolute; z-index: 20; width: 212px; padding: 12px; border-radius: 10px;
            background: var(--card); border: 1px solid var(--line); box-shadow: 0 6px 24px rgba(0, 0, 0, .25); }
  .picker[hidden] { display: none; }
  .wheel { position: relative; width: 186px; height: 186px; border-radius: 50%; cursor: crosshair; touch-action: none;
           background: radial-gradient(circle closest-side, #fff, transparent),
                       conic-gradient(red, yellow, lime, cyan, blue, magenta, red); }
  .wheel .shade { position: absolute; inset: 0; border-radius: 50%; background: #000; pointer-events: none; }
  .wheel .dot { position: absolute; width: 12px; height: 12px; margin: -6px 0 0 -6px; border-radius: 50%;
                border: 2px solid #fff; box-shadow: 0 0 0 1px rgba(0, 0, 0, .6); pointer-events: none; }
  .picker input[type=range] { width: 100%; margin: 10px 0 8px; padding: 0; }
  .picker .foot { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--muted); }
  .picker .foot span { flex: 1; font-variant-numeric: tabular-nums; }
  .thumb { width: 96px; height: 96px; border-radius: 8px; object-fit: cover; background: var(--line);
           cursor: pointer; }
  .thumb:hover { outline: 2px solid var(--accent); outline-offset: 1px; }
  .badge.frozen { color: var(--accent); border-color: var(--accent); }
  .badge[hidden] { display: none; }
  .views-backdrop { position: fixed; inset: 0; z-index: 30; background: rgba(0, 0, 0, .45);
                    display: flex; align-items: flex-start; justify-content: center; padding: 40px 16px; overflow-y: auto; }
  .views-backdrop[hidden] { display: none; }
  .views-sheet { background: var(--card); border: 1px solid var(--line); border-radius: 12px; width: 100%;
                 max-width: 760px; padding: 16px; box-shadow: 0 10px 40px rgba(0, 0, 0, .3); }
  .views-sheet .head { display: flex; align-items: baseline; gap: 10px; }
  .views-sheet h2 { margin: 0; flex: 1; }
  .views-sheet .count { color: var(--muted); font-size: 13px; font-weight: 400; }
  .views-sheet .note { color: var(--muted); font-size: 13px; margin: 6px 0 10px; }
  .views-sheet .freeze { display: flex; gap: 8px; align-items: center; margin: 0 0 12px; font-size: 14px; color: var(--text); }
  .views-sheet .freeze input { width: auto; margin: 0; }
  .view-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); gap: 10px; }
  .view { position: relative; }
  .view img { width: 100%; aspect-ratio: 1; object-fit: cover; border-radius: 8px; background: var(--line); display: block; }
  .view .n { position: absolute; left: 5px; top: 5px; font-size: 11px; padding: 0 5px; border-radius: 4px;
             background: rgba(0, 0, 0, .55); color: #fff; font-variant-numeric: tabular-nums; }
  .view button { position: absolute; right: 5px; top: 5px; padding: 1px 7px; font-size: 12px;
                 color: var(--danger); background: var(--card); }
  .view.deleting { opacity: .35; pointer-events: none; }
  .view .score { font-size: 11.5px; color: var(--muted); margin-top: 3px; font-variant-numeric: tabular-nums;
                 line-height: 1.3; }
  .view.suspect img { outline: 3px solid var(--danger); outline-offset: -3px; }
  .view img { cursor: pointer; }
  .view.cover img { box-shadow: 0 0 0 3px var(--accent); }
  .view .picked { position: absolute; left: 5px; top: 26px; font-size: 11px; padding: 0 5px; border-radius: 4px;
                  background: var(--accent); color: #fff; }
  .view:not(.cover) .picked { display: none; }
  .view.suspect .score .vs { color: var(--danger); font-weight: 600; }
  .learning { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; margin: 0 0 12px;
              padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px; font-size: 13px; }
  .learning .title { width: 100%; color: var(--muted); font-size: 12px; }
  .learning label { display: inline-flex; gap: 6px; align-items: center; margin: 0; color: var(--text); font-size: 13px; }
  .learning input { width: 74px; padding: 4px 6px; }
  .top { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; padding-right: 28px; }
  .id { font-weight: 600; font-variant-numeric: tabular-nums; }
  .badge { font-size: 12px; padding: 1px 7px; border-radius: 99px; border: 1px solid var(--line); color: var(--muted); }
  .badge.live { color: var(--live); border-color: var(--live); }
  label { display: block; font-size: 12px; color: var(--muted); margin: 8px 0 3px; }
  input { width: 100%; font: inherit; padding: 6px 8px; border: 1px solid var(--line); border-radius: 6px;
          background: var(--field); color: var(--text); }
  textarea { width: 100%; font: inherit; padding: 6px 8px; border: 1px solid var(--line); border-radius: 6px;
             background: var(--field); color: var(--text); resize: none; overflow: hidden; display: block; }
  input:focus, textarea:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
  .desc { grid-column: 1 / -1; font-size: 13px; color: var(--muted); margin: 0; }
  .desc.pending { font-style: italic; }
  .card select { width: 100%; }
  .row { display: flex; gap: 6px; align-items: center; }
  .row input { flex: 1; }
  .meter { height: 4px; background: var(--line); border-radius: 2px; margin-top: 8px; overflow: hidden; }
  .meter div { height: 100%; background: var(--accent); width: 0; transition: width .3s; }
  .actions { grid-column: 1 / -1; display: flex; gap: 8px; flex-wrap: wrap; }
  button { font: inherit; font-size: 13px; padding: 5px 10px; border-radius: 6px; cursor: pointer;
           border: 1px solid var(--line); background: var(--field); color: var(--text); }
  button:hover { border-color: var(--accent); }
  button.danger { color: var(--danger); margin-left: auto; }
  .add-tile { width: 100%; height: 100%; align-self: stretch; padding: 14px;
              display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px;
              font-size: 14px; font-weight: 500; line-height: 1.3; color: var(--muted); background: var(--card);
              border: 1px dashed var(--line); border-radius: 10px; }
  .add-tile .plus { font-size: 40px; font-weight: 300; line-height: 1; }
  .add-tile:hover { color: var(--accent); border-color: var(--accent); }
  .card.param { grid-template-rows: minmax(0, 1fr) auto auto; }
  .card.param > .thumb { align-self: start; }
  .card.param > .body { display: flex; flex-direction: column; min-height: 0; min-width: 0; }
  .card.param textarea { flex: 1 1 0; min-height: 48px; overflow: auto; }
  .card.param .weight-block { margin-top: auto; }
  .card.param .weight-label { display: flex; justify-content: space-between; align-items: baseline; }
  .card.param .weight-label .now { color: var(--text); font-size: 13px; font-variant-numeric: tabular-nums; }
  .card.param .weight { display: flex; align-items: center; gap: 8px; }
  .card.param .weight .bound { flex: 0 0 auto; font-size: 12px; color: var(--muted);
                               font-variant-numeric: tabular-nums; }
  .card.param .weight input[type=range] { flex: 1 1 auto; min-width: 0; width: auto; height: 22px;
                                          margin: 0; padding: 0; border: 0; background: transparent;
                                          accent-color: var(--accent); }
  .card.param .weight input:disabled { opacity: .85; }
  .card.param .desc { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .card.other { grid-template-columns: 1fr; height: auto; }
  .card.other .switch { display: flex; gap: 8px; align-items: center; margin: 12px 0 0;
                        color: var(--text); font-size: 14px; }
  .card.other .switch input { width: auto; margin: 0; }
  .empty { color: var(--muted); grid-column: 1 / -1; padding: 40px 0; text-align: center; }
  select { font: inherit; padding: 6px 8px; border: 1px solid var(--line); border-radius: 6px;
           background: var(--field); color: var(--text); }
  #play { min-width: 76px; }
  #play.paused { color: var(--live); border-color: var(--live); }
  section.overview { max-width: 1100px; margin: 0 auto; padding: 0 16px 6px; }
  .tabs { display: flex; gap: 2px; border-bottom: 1px solid var(--line); margin-bottom: 6px; }
  .tabs button { border: 0; border-bottom: 2px solid transparent; border-radius: 0; background: none;
                 padding: 4px 10px; color: var(--muted); }
  .tabs button[aria-selected=true] { color: var(--text); border-bottom-color: var(--accent); }
  #models, #services, #api { font-size: 12.5px; color: var(--muted); border-collapse: collapse; }
  #models td, #services td, #api td { padding: 1px 14px 1px 0; vertical-align: top; }
  #models td:first-child, #services td:first-child, #api td:first-child { color: var(--text); white-space: nowrap; }
  #models .remote { color: var(--accent); }
  #services td, #api td { padding-bottom: 6px; }
  #services .started { color: var(--muted); font-size: 11.5px; }
  #services .up { color: var(--live); white-space: nowrap; }
  #services .down { white-space: nowrap; }
  .eps { display: flex; flex-wrap: wrap; gap: 2px 14px; }
  .ep { white-space: nowrap; font-variant-numeric: tabular-nums; }
  .ep b { display: inline-block; min-width: 34px; font-weight: 600; font-size: 10.5px; }
  #services a, #api a { color: var(--accent); text-decoration: none; }
  #services a:hover, #api a:hover { text-decoration: underline; }
  section.combos { max-width: 1100px; margin: 0 auto; padding: 4px 16px 12px; }
  section.tracked { max-width: 1100px; margin: 0 auto; padding: 4px 16px 0; }
  .panel-tabs { display: flex; gap: 2px; border-bottom: 1px solid var(--line); }
  .panel-tabs button { border: 0; border-bottom: 2px solid transparent; border-radius: 0; background: none;
                       padding: 6px 12px; color: var(--muted); }
  .panel-tabs button[aria-selected=true] { color: var(--text); border-bottom-color: var(--accent); }
  h2 { font-size: 15px; margin: 8px 0; }
  .combo { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px;
           display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-bottom: 8px; }
  .combo .who { font-weight: 600; min-width: 140px; }
  .combo input[data-key=prompt] { flex: 1; min-width: 180px; width: auto; }
  .combo input[type=number] { width: 80px; }
  .combo.active { border-color: var(--live); }
  .dist { display: inline-flex; gap: 5px; align-items: center; font-size: 13px; color: var(--muted); white-space: nowrap; }
  .help { position: relative; display: inline-flex; align-items: center; justify-content: center;
          width: 15px; height: 15px; border: 1px solid var(--muted); border-radius: 50%;
          font-size: 10.5px; font-weight: 600; line-height: 1; cursor: help; }
  .help::after { content: attr(data-tip); position: absolute; bottom: calc(100% + 6px); left: 50%;
                 transform: translateX(-50%); width: 260px; padding: 7px 9px; border-radius: 6px;
                 background: var(--text); color: var(--bg); font-size: 12px; font-weight: 400; line-height: 1.4;
                 white-space: normal; z-index: 10; pointer-events: none; opacity: 0; visibility: hidden;
                 transition: opacity .12s; }
  .help:hover::after, .help:focus::after { opacity: 1; visibility: visible; }
  .picks { display: flex; gap: 10px; flex-wrap: wrap; font-size: 14px; }
  .picks label { display: inline-flex; gap: 4px; align-items: center; margin: 0; color: var(--text); font-size: 14px; }
  .picks input { width: auto; }
</style>
</head>
<body>
<header>
  <h1>Superconductor - Prompts (MusicCoCa)</h1>
  <span id="status">connecting…</span>
  <button id="play" disabled title="pause / resume music generation on the server">Pause</button>
</header>
<section class="overview">
  <nav class="tabs" role="tablist">
    <button role="tab" data-tab="models" aria-selected="true">Models</button>
    <button role="tab" data-tab="services" aria-selected="false">Services</button>
    <button role="tab" data-tab="api" aria-selected="false">API</button>
  </nav>
  <table id="models"></table>
  <table id="services" hidden></table>
  <table id="api" hidden></table>
</section>
<section class="combos">
  <h2>Combos <span id="combo-hint" style="font-weight:400;color:var(--muted);font-size:13px">
    objects close together play this instead of their own instruments</span></h2>
  <div id="combos"></div>
  <div class="combo" id="new-combo">
    <div class="picks" id="picks"></div>
    <input data-key="prompt" placeholder="what they play together">
    <span class="dist">join distance <span class="help" tabindex="0" data-tip="How close the objects must be to play together: the gap between their boxes (edge to edge), as a fraction of the frame width. 0.05 = 5% of the frame width; 0 = touching. They separate again beyond 1.5x this distance.">?</span>
      <input type="number" step="0.01" min="0" value="0.05"></span>
    <button id="add-combo">Add combo</button>
  </div>
</section>
<section class="tracked">
  <nav class="panel-tabs" role="tablist" aria-label="Prompts">
    <button role="tab" data-panel="parameters" aria-selected="true">Parameters</button>
    <button role="tab" data-panel="objects" aria-selected="false">Objects</button>
    <button role="tab" data-panel="other" aria-selected="false">Other</button>
  </nav>
</section>
<div id="parameters" class="grid"><button type="button" id="add-param" class="add-tile"><span class="plus" aria-hidden="true">+</span>Add new parameter</button></div>
<main id="list" class="grid" hidden><p class="empty">No objects yet. Show something to the camera.</p></main>
<div id="other" class="grid" hidden></div>
<script>
const list = document.getElementById("list");
const status = document.getElementById("status");
const cards = new Map();  // id -> card element
const viewCounts = new Map();  // id -> "view_rev:cover" of its thumbnail
let lastState = null;

async function post(path, body, method = "POST") {
  await fetch(path, { method, headers: { "Content-Type": "application/json" },
                      body: body ? JSON.stringify(body) : undefined });
}

function field(card, key, id, placeholder) {
  const input = card.querySelector(`[data-key=${key}]`);
  input.placeholder = placeholder;
  const save = () => {
    if (input.value === input.dataset.saved) return;
    input.dataset.saved = input.value;
    post(`/api/objects/${id}`, { [key]: input.value.trim() });
  };
  input.addEventListener("change", save);
  input.addEventListener("keydown", e => { if (e.key === "Enter") { e.preventDefault(); input.blur(); } });
  return input;
}

// trigger values stay "near" / "held" / "visible"; only the labels are spelled out
const TRIGGER_OPTIONS = `
  <option value="near">close to the crosshair (louder the closer it is)</option>
  <option value="held">a hand is holding it</option>
  <option value="visible">it is in view</option>`;

// grow a textarea to fit its text, so long prompts are fully readable
function fit(textarea) {
  textarea.style.height = "auto";
  textarea.style.height = `${textarea.scrollHeight + 2}px`;
}

function makeCard(o) {
  const card = document.createElement("article");
  card.className = "card";
  card.innerHTML = `
    <button class="swatch" title="color: click to pick"></button>
    <img class="thumb" alt="">
    <div>
      <div class="top"><span class="id">#${o.id}</span><span class="badge"></span>
        <span class="badge frozen" hidden title="learns no new views (click the picture to change)">frozen</span></div>
      <label>Name</label>
      <input data-key="name">
      <label>Instrument</label>
      <textarea data-key="instrument" rows="1"></textarea>
      <label>Plays when</label>
      <select data-key="trigger">${TRIGGER_OPTIONS}</select>
      <div class="meter"><div></div></div>
    </div>
    <p class="desc"></p>
    <div class="actions">
      <button data-act="describe">Describe again</button>
      <button data-act="suggest">Suggest instrument</button>
      <button data-act="delete" class="danger">Delete</button>
    </div>`;
  field(card, "name", o.id, "unnamed");
  const instrument = field(card, "instrument", o.id, "none yet: silent");
  instrument.addEventListener("input", () => fit(instrument));
  const trigger = card.querySelector("[data-key=trigger]");
  trigger.onchange = () => post(`/api/objects/${o.id}`, { trigger: trigger.value });
  card.querySelector(".swatch").onclick = e => { e.stopPropagation(); openPicker(card, o.id); };
  const thumb = card.querySelector(".thumb");
  thumb.title = "views: click to see them, delete wrong ones or freeze";
  thumb.onclick = () => openViews(o.id);
  card.querySelector("[data-act=describe]").onclick = () => post(`/api/objects/${o.id}/describe`);
  card.querySelector("[data-act=suggest]").onclick = () => post(`/api/objects/${o.id}/suggest`);
  card.querySelector("[data-act=delete]").onclick = () => {
    if (confirm(`Delete #${o.id}${o.name ? " " + o.name : ""}? It moves to superconductor_client/tracking/library/.trash.`))
      post(`/api/objects/${o.id}`, null, "DELETE");
  };
  return card;
}

// Put `el` at position `index` of `parent`, moving it only if it is elsewhere.
// Moving an element blurs a text box inside it, so never move the one being typed in.
function place(parent, el, index) {
  if (parent.children[index] === el) return;
  if (el.parentNode && el.contains(document.activeElement)) return;
  parent.insertBefore(el, parent.children[index] || null);
}

function setInput(input, value) {
  value = value || "";
  if (document.activeElement === input || input.value !== (input.dataset.saved ?? input.value)) return;
  input.value = value;
  input.dataset.saved = value;
}

function render(objects) {
  const seen = new Set();
  objects.forEach((o, i) => {
    seen.add(o.id);
    let card = cards.get(o.id);
    if (!card) { card = makeCard(o); cards.set(o.id, card); }
    place(list, card, i);  // server order: in view first
    card.classList.toggle("away", !o.in_view);
    const badge = card.querySelector(".badge");
    badge.textContent = o.in_view ? "in view" : o.last_seen;
    badge.classList.toggle("live", o.in_view);
    setInput(card.querySelector("[data-key=name]"), o.name);
    const instrument = card.querySelector("[data-key=instrument]");
    setInput(instrument, o.instrument);
    fit(instrument);
    const trig = card.querySelector("[data-key=trigger]");
    if (document.activeElement !== trig) trig.value = o.trigger || "near";
    card.querySelector(".meter div").style.width = `${Math.round(100 * (o.value || 0))}%`;
    card.querySelector(".meter").title = o.parameter ? `${o.parameter}: ${(o.value || 0).toFixed(2)}` : "";
    const desc = card.querySelector(".desc");
    desc.textContent = o.describing ? "describing…" : (o.description || "no description yet");
    desc.classList.toggle("pending", o.describing || !o.description);
    const swatch = card.querySelector(".swatch");
    card.dataset.color = o.color || "";
    if (picker.card !== card) {
      swatch.style.background = o.color || "";
      swatch.classList.toggle("none", !o.color);
    }
    swatch.title = !o.color ? "no color yet (it is measured when the object is in view); click to pick one"
      : o.color_picked ? `color ${o.color} (picked); click to change` : `color ${o.color} (average of the object's pixels); click to change`;
    const thumbKey = `${o.view_rev}:${o.cover}`;
    if (viewCounts.get(o.id) !== thumbKey) {
      viewCounts.set(o.id, thumbKey);
      card.querySelector(".thumb").src = o.cover === null ? `/api/objects/${o.id}/view.jpg?r=${o.view_rev}`
        : `/api/objects/${o.id}/views/${o.cover}.jpg?r=${o.view_rev}`;
    }
    card.querySelector(".badge.frozen").hidden = !o.frozen;
  });
  for (const [id, card] of cards) if (!seen.has(id)) { card.remove(); cards.delete(id); }
  const empty = list.querySelector(".empty");
  if (empty) empty.style.display = objects.length ? "none" : "";
}

// color wheel for an object's color: angle = hue, distance from the center = saturation,
// slider = brightness. Sends the color when you let go; "Auto" goes back to the average color.
const picker = (() => {
  const el = document.createElement("div");
  el.className = "picker";
  el.hidden = true;
  el.innerHTML = `<div class="wheel"><div class="shade"></div><div class="dot"></div></div>
    <input type="range" min="0" max="100" title="brightness">
    <div class="foot"><span></span><button data-act="auto" title="the average color of the object's pixels">Auto</button></div>`;
  document.body.appendChild(el);
  return { el, wheel: el.querySelector(".wheel"), shade: el.querySelector(".shade"), dot: el.querySelector(".dot"),
           range: el.querySelector("input"), label: el.querySelector(".foot span"), card: null, id: null,
           kind: "object", hsv: [0, 0, 1] };
})();

function hsvToHex([h, s, v]) {
  const f = n => { const k = (n + h / 60) % 6; return v - v * s * Math.max(0, Math.min(k, 4 - k, 1)); };
  return "#" + [f(5), f(3), f(1)].map(x => Math.round(x * 255).toString(16).padStart(2, "0")).join("");
}

function hexToHsv(hex) {
  const [r, g, b] = [1, 3, 5].map(i => parseInt(hex.slice(i, i + 2), 16) / 255);
  const v = Math.max(r, g, b), d = v - Math.min(r, g, b);
  const h = d === 0 ? 0 : v === r ? ((g - b) / d + 6) % 6 : v === g ? (b - r) / d + 2 : (r - g) / d + 4;
  return [h * 60, v ? d / v : 0, v];
}

function showPicker() {
  const [h, s, v] = picker.hsv, r = 93;  // wheel radius (px)
  picker.dot.style.left = `${r + s * r * Math.sin(h * Math.PI / 180)}px`;
  picker.dot.style.top = `${r - s * r * Math.cos(h * Math.PI / 180)}px`;
  picker.shade.style.opacity = 1 - v;
  picker.range.value = Math.round(v * 100);
  const hex = hsvToHex(picker.hsv);
  picker.dot.style.background = hex;
  picker.label.textContent = hex;
  const swatch = picker.card.querySelector(".swatch");
  swatch.style.background = hex;
  swatch.classList.remove("none");
}

function openPicker(card, id, kind = "object") {
  if (picker.card === card) { closePicker(); return; }
  picker.card = card;
  picker.id = id;
  picker.kind = kind;
  picker.hsv = card.dataset.color ? hexToHsv(card.dataset.color) : [0, 0, 1];
  const box = card.querySelector(".swatch").getBoundingClientRect();
  picker.el.style.top = `${box.bottom + window.scrollY + 6}px`;
  picker.el.style.left = `${Math.max(8, box.right + window.scrollX - 212 - 24)}px`;
  picker.el.hidden = false;
  showPicker();
}

function closePicker() {
  picker.el.hidden = true;
  picker.card = null;
}

const pickerPath = () => picker.kind === "param" ? `/api/parameters/${picker.id}` : `/api/objects/${picker.id}`;
const sendColor = () => post(pickerPath(), { color: hsvToHex(picker.hsv) });

function pickAt(e) {
  const box = picker.wheel.getBoundingClientRect();
  const dx = e.clientX - box.left - box.width / 2, dy = e.clientY - box.top - box.height / 2;
  picker.hsv[0] = (Math.atan2(dx, -dy) * 180 / Math.PI + 360) % 360;  // clockwise from the top, like the gradient
  picker.hsv[1] = Math.min(1, Math.hypot(dx, dy) / (box.width / 2));
  showPicker();
}

picker.wheel.addEventListener("pointerdown", e => { picker.wheel.setPointerCapture(e.pointerId); pickAt(e); });
picker.wheel.addEventListener("pointermove", e => { if (picker.wheel.hasPointerCapture(e.pointerId)) pickAt(e); });
picker.wheel.addEventListener("pointerup", sendColor);
picker.range.addEventListener("input", () => { picker.hsv[2] = picker.range.value / 100; showPicker(); });
picker.range.addEventListener("change", sendColor);
picker.el.querySelector("[data-act=auto]").onclick = () => {
  post(pickerPath(), { color: null });
  closePicker();
};
document.addEventListener("pointerdown", e => {
  if (picker.card && !picker.el.contains(e.target) && !picker.card.querySelector(".swatch").contains(e.target))
    closePicker();
});
document.addEventListener("keydown", e => { if (e.key === "Escape" && picker.card) closePicker(); });

// views of one object (click its picture): the reference pictures recognition compares
// the camera's view with. Wrong ones can be deleted; "freeze" stops it learning new ones.
const viewsUi = (() => {
  const el = document.createElement("div");
  el.className = "views-backdrop";
  el.hidden = true;
  el.innerHTML = `<div class="views-sheet" role="dialog" aria-modal="true">
    <div class="head"><h2></h2><button data-act="close">Close</button></div>
    <p class="note">Recognition compares what the camera sees with these views; the closest one decides
      which object it is. Delete any that show another object, a hand or background.
      Click a view to show it as the object's picture.</p>
    <label class="freeze"><input type="checkbox"> Freeze: learn no new views</label>
    <div class="learning">
      <span class="title">Learning, for all objects (until the app restarts; defaults in collab.toml)</span>
      <label>views kept <span class="help" tabindex="0" data-tip="gallery_size: most views an object keeps. Over this, adding a view drops the one most similar to another.">?</span>
        <input type="number" data-key="gallery_size" min="1" step="1"></label>
      <label>novelty <span class="help" tabindex="0" data-tip="A view is learned only if its similarity to every kept view is below this (it shows something new).">?</span>
        <input type="number" data-key="novelty" min="0" max="1" step="0.01"></label>
      <label>learn threshold <span class="help" tabindex="0" data-tip="...and only if its similarity to the closest kept view is at least this (else it is more likely another object). Must be below novelty.">?</span>
        <input type="number" data-key="learn_threshold" min="0" max="1" step="0.01"></label>
    </div>
    <div class="view-grid"></div></div>`;
  document.body.appendChild(el);
  return { el, title: el.querySelector("h2"), freeze: el.querySelector(".freeze input"),
           learning: [...el.querySelectorAll(".learning input")],
           grid: el.querySelector(".view-grid"), id: null, rev: null };
})();

function openViews(id) {
  viewsUi.id = id;
  viewsUi.rev = null;
  viewsUi.el.hidden = false;
  if (lastState) renderViews(lastState);
}

function closeViews() {
  viewsUi.el.hidden = true;
  viewsUi.id = null;
}

function renderViews(state) {
  if (viewsUi.id === null) return;
  const o = state.objects.find(o => o.id === viewsUi.id);
  if (!o) { closeViews(); return; }
  viewsUi.title.innerHTML = "";
  viewsUi.title.append(`#${o.id}${o.name ? " " + o.name : ""} `);
  const count = document.createElement("span");
  count.className = "count";
  count.textContent = `${o.views} of at most ${state.learning.gallery_size} views`;
  viewsUi.title.append(count);
  if (document.activeElement !== viewsUi.freeze) viewsUi.freeze.checked = o.frozen;
  viewsUi.learning.forEach(input => {
    if (document.activeElement !== input) input.value = state.learning[input.dataset.key];
  });
  if (viewsUi.rev !== o.view_rev) buildViews(o);
  // scores change when any object's views change, so they are refreshed every time
  const name = id => objName(state.objects, id);
  viewsUi.grid.querySelectorAll(".view").forEach((v, i) => {
    const [own, other, otherId] = o.view_scores[i] || [null, null, null];
    const f = x => x === null ? "–" : x.toFixed(2);
    const score = v.querySelector(".score"), vs = document.createElement("span");
    vs.className = "vs";
    vs.textContent = otherId === null ? "no other objects" : `${name(otherId)} ${f(other)}`;
    score.replaceChildren(`own ${f(own)}`, document.createElement("br"), vs);
    const suspect = own !== null && other !== null && other >= own;
    v.classList.toggle("suspect", suspect);
    v.classList.toggle("cover", o.cover === null ? i === o.views - 1 : i === o.cover);
    v.title = suspect ? `looks more like ${name(otherId)} than like the rest of this object's views: likely wrong`
      : "own: similarity to this object's closest other view; below: to the closest view of any other object";
  });
}

function buildViews(o) {
  viewsUi.rev = o.view_rev;
  viewsUi.grid.innerHTML = "";
  for (let i = 0; i < o.views; i++) {
    const v = document.createElement("div");
    v.className = "view";
    v.innerHTML = `<img alt="view ${i + 1}" loading="lazy"><span class="n">${i + 1}</span>
      <span class="picked">picture</span>
      <button title="delete this view">Delete</button><div class="score"></div>`;
    const img = v.querySelector("img");
    img.src = `/api/objects/${o.id}/views/${i}.jpg?r=${o.view_rev}`;
    img.onclick = () => {
      post(`/api/objects/${o.id}/cover`, { index: i, rev: o.view_rev });
      viewsUi.grid.querySelectorAll(".view").forEach((x, j) => x.classList.toggle("cover", j === i));
    };
    const del = v.querySelector("button");
    if (o.views <= 1) { del.disabled = true; del.title = "the last view can't be deleted"; }
    del.onclick = () => {
      v.classList.add("deleting");
      post(`/api/objects/${o.id}/views/${i}?rev=${o.view_rev}`, null, "DELETE");
      // numbering shifts after a delete: block the others until the new views arrive
      viewsUi.grid.querySelectorAll(".view").forEach(x => x.classList.add("deleting"));
      // if it was refused (the client says why), rebuild the grid as it is
      setTimeout(() => { if (viewsUi.rev === o.view_rev) viewsUi.rev = null; }, 3000);
    };
    viewsUi.grid.appendChild(v);
  }
}

viewsUi.freeze.onchange = () => post(`/api/objects/${viewsUi.id}`, { frozen: viewsUi.freeze.checked });
viewsUi.learning.forEach(input => {
  input.onchange = () => { if (input.value !== "") post("/api/learning", { [input.dataset.key]: Number(input.value) }); };
  input.addEventListener("keydown", e => { if (e.key === "Enter") input.blur(); });
});
viewsUi.el.querySelector("[data-act=close]").onclick = closeViews;
viewsUi.el.addEventListener("pointerdown", e => { if (e.target === viewsUi.el) closeViews(); });
document.addEventListener("keydown", e => { if (e.key === "Escape" && viewsUi.id !== null) closeViews(); });

const combosEl = document.getElementById("combos");
const picks = document.getElementById("picks");
const comboRows = new Map();  // "1+2" -> row

function objName(objects, id) {
  const o = objects.find(o => o.id === id);
  return o && o.name ? o.name : `#${id}`;
}

function renderCombos(combos, objects) {
  const seen = new Set();
  combos.forEach((c, i) => {
    const key = c.objects.join("+");
    seen.add(key);
    let row = comboRows.get(key);
    if (!row) {
      row = document.createElement("div");
      row.className = "combo";
      row.innerHTML = `<span class="who"></span><input data-key="prompt">
        <span class="dist">join distance <span class="help" tabindex="0" data-tip="How close the objects must be to play together: the gap between their boxes (edge to edge), as a fraction of the frame width. 0.05 = 5% of the frame width; 0 = touching. They separate again beyond 1.5x this distance.">?</span>
          <input type="number" step="0.01" min="0"></span>
        <select title="plays when">${TRIGGER_OPTIONS}</select>
        <span class="badge"></span><button class="danger">Delete</button>`;
      const [prompt, dist] = row.querySelectorAll("input");
      const sel = row.querySelector("select");
      const idx = () => Number(row.dataset.index);
      prompt.onchange = () => post(`/api/combos/${idx()}`, { prompt: prompt.value.trim() });
      dist.onchange = () => post(`/api/combos/${idx()}`, { distance: dist.value });
      sel.onchange = () => post(`/api/combos/${idx()}`, { trigger: sel.value });
      row.querySelector("button").onclick = () => post(`/api/combos/${idx()}`, null, "DELETE");
      comboRows.set(key, row);
    }
    place(combosEl, row, i);
    row.dataset.index = c.index;
    row.classList.toggle("active", c.active);
    row.querySelector(".who").textContent = c.objects.map(id => objName(objects, id)).join(" + ");
    const [prompt, dist] = row.querySelectorAll("input");
    if (document.activeElement !== prompt) prompt.value = c.prompt;
    if (document.activeElement !== dist) dist.value = c.distance;
    const sel = row.querySelector("select");
    if (document.activeElement !== sel) sel.value = c.trigger;
    const badge = row.querySelector(".badge");
    badge.textContent = c.active ? "combined" : "apart";
    badge.classList.toggle("live", c.active);
  });
  for (const [key, row] of comboRows) if (!seen.has(key)) { row.remove(); comboRows.delete(key); }

  // object checkboxes for a new combo (keep what is ticked)
  const ticked = new Set([...picks.querySelectorAll("input:checked")].map(i => Number(i.value)));
  const ids = objects.map(o => o.id).sort((a, b) => a - b);
  if (picks.dataset.ids !== ids.join(",") + "|" + objects.map(o => o.name).join(",")) {
    picks.dataset.ids = ids.join(",") + "|" + objects.map(o => o.name).join(",");
    picks.innerHTML = ids.length < 2 ? '<span style="color:var(--muted)">needs at least two objects</span>' : "";
    if (ids.length >= 2) ids.forEach(id => {
      const l = document.createElement("label");
      l.innerHTML = `<input type="checkbox" value="${id}"${ticked.has(id) ? " checked" : ""}> `;
      l.append(objName(objects, id));
      picks.appendChild(l);
    });
  }
}

document.getElementById("add-combo").onclick = () => {
  const form = document.getElementById("new-combo");
  const objects = [...picks.querySelectorAll("input:checked")].map(i => Number(i.value));
  const prompt = form.querySelector("[data-key=prompt]");
  const dist = form.querySelector("input[type=number]");
  if (objects.length < 2 || !prompt.value.trim()) { alert("Tick at least two objects and type what they play."); return; }
  post("/api/combos", { objects, prompt: prompt.value.trim(), distance: dist.value });
  prompt.value = "";
  picks.querySelectorAll("input:checked").forEach(i => { i.checked = false; });
};

// play / pause: the server stops generating; what it already sent (well under a second) still plays
const play = document.getElementById("play");
play.onclick = () => post("/api/music", { paused: !play.classList.contains("paused") });

function renderMusic(music) {
  const paused = !!(music && music.paused);
  play.disabled = !(music && music.connected);
  play.classList.toggle("paused", paused);
  play.textContent = paused ? "▶ Play" : "❚❚ Pause";
}

// Models / Services tabs (the choice is remembered in this browser)
function showTab(name) {
  document.querySelectorAll(".tabs button").forEach(b => b.setAttribute("aria-selected", b.dataset.tab === name));
  for (const tab of ["models", "services", "api"]) document.getElementById(tab).hidden = name !== tab;
  try { localStorage.setItem("objects-tab", name); } catch {}
}
document.querySelectorAll(".tabs button").forEach(b => b.onclick = () => showTab(b.dataset.tab));
try { const t = localStorage.getItem("objects-tab"); if (t === "services" || t === "api") showTab(t); } catch {}

const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);

const link = url => `<a href="${esc(url)}" target="_blank" rel="noopener">${esc(url)}</a>`;
const setRows = (table, rows) => { if (table.dataset.rows !== rows) { table.innerHTML = rows; table.dataset.rows = rows; } };

// Services: where each program runs, whether it answers, and its pages
function renderServices(services) {
  setRows(document.getElementById("services"), (services || []).map(s => {
    const up = s.up === null ? '<td class="down">checking…</td>'
      : s.up ? '<td class="up">● up</td>' : '<td class="down">○ not running</td>';
    const pages = s.endpoints.filter(e => e.method === "page").map(e => `<span class="ep">${link(e.url)}</span>`);
    const eps = pages.length ? pages.join("") : `<span class="ep">${esc(s.base)}</span>`;
    const note = s.note ? `<div>${esc(s.note)}</div>` : "";
    return `<tr><td>${esc(s.name)}<div class="started">${esc(s.started)}</div></td>${up}` +
      `<td><div class="eps">${eps}</div>${note}</td></tr>`;
  }).join(""));
}

// API: every endpoint, GET ones as links (POST and websocket ones would only error in a browser)
function renderApi(services) {
  setRows(document.getElementById("api"), (services || []).map(s => {
    const eps = s.endpoints.filter(e => e.method !== "page").map(e =>
      `<span class="ep"><b>${e.method}</b>${e.method === "GET" ? link(e.url) : esc(e.url)}</span>`);
    return eps.length ? `<tr><td>${esc(s.name)}</td><td><div class="eps">${eps.join("")}</div></td></tr>` : "";
  }).join(""));
}

const paramGrid = document.getElementById("parameters");
const paramCards = new Map();
const iconRevs = new Map();
let focusNewParam = false;
let knobsAtAdd = 0;
const EMPTY_ICON = "data:image/svg+xml;charset=utf-8," + encodeURIComponent(
  '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96"></svg>');

function makeParamCard(p) {
  const card = document.createElement("article");
  card.className = "card param";
  card.innerHTML = `
    <button class="swatch" title="color: click to pick"></button>
    <img class="thumb icon" alt="">
    <div class="body">
      <div class="top"><span class="id"></span><span class="badge" hidden></span></div>
      <label>Prompt</label>
      <textarea data-key="prompt" rows="2"></textarea>
      <div class="weight-block">
        <label class="weight-label">Weight <span class="now">0.00</span></label>
        <div class="weight">
          <span class="bound">0.00</span>
          <input type="range" data-key="value" min="0" max="1" step="0.01" value="0" aria-label="Weight from 0.00 to 1.00">
          <span class="bound">1.00</span>
        </div>
      </div>
    </div>
    <p class="desc"></p>
    <div class="actions">
      ${p.editable ? "" : `<button data-act="icon">Draw icon</button>`}
      ${p.editable ? `<button data-act="delete" class="danger">Delete</button>` : ""}
    </div>`;
  const prompt = card.querySelector("[data-key=prompt]");
  const slider = card.querySelector("[data-key=value]");
  const readout = card.querySelector(".now");
  prompt.placeholder = "what this parameter plays";
  if (p.editable) {
    const save = (key, value) => post(`/api/parameters/${p.id}`, { [key]: value });
    const commitPrompt = () => {
      if (prompt.value === prompt.dataset.saved) return;
      prompt.dataset.saved = prompt.value;
      save("prompt", prompt.value.trim());
    };
    prompt.addEventListener("blur", commitPrompt);
    prompt.addEventListener("keydown", e => {
      if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); prompt.blur(); }
    });
    let valueTimer = 0;
    const showWeight = () => { readout.textContent = Number(slider.value).toFixed(2); };
    const commitWeight = () => {
      clearTimeout(valueTimer);
      showWeight();
      save("value", Number(slider.value));
    };
    slider.addEventListener("input", () => {
      showWeight();
      clearTimeout(valueTimer);
      valueTimer = setTimeout(commitWeight, 120);
    });
    slider.addEventListener("change", commitWeight);
    card.querySelector(".swatch").onclick = e => { e.stopPropagation(); openPicker(card, p.id, "param"); };
    card.querySelector("[data-act=delete]").onclick = () => {
      const label = prompt.value.trim();
      if (confirm(`Delete parameter #${p.id}${label ? " " + label : ""}?`))
        post(`/api/parameters/${p.id}`, null, "DELETE");
    };
  } else {
    prompt.disabled = slider.disabled = true;
    card.querySelector(".swatch").disabled = true;
  }
  const icon = card.querySelector("[data-act=icon]");
  if (icon) icon.onclick = () => {
    if (!prompt.value.trim()) { alert("Type a prompt first."); return; }
    post(`/api/parameters/${encodeURIComponent(p.id)}/icon`);
  };
  return card;
}

function renderParameters(params) {
  const seen = new Set();
  params.forEach((p, i) => {
    const key = String(p.id);
    seen.add(key);
    let card = paramCards.get(key);
    if (!card) { card = makeParamCard(p); paramCards.set(key, card); }
    place(paramGrid, card, i + 1);  // the add button stays in the top-left cell
    card.querySelector(".id").textContent = p.origin === "service" ? p.service : `#${p.id}`;
    const badge = card.querySelector(".badge");
    badge.textContent = p.badge || "";
    badge.hidden = !p.badge;
    badge.classList.toggle("live", !!p.live);
    const prompt = card.querySelector("[data-key=prompt]");
    setInput(prompt, p.prompt);
    const slider = card.querySelector("[data-key=value]");
    const readout = card.querySelector(".now");
    if (document.activeElement !== slider) {
      const value = Math.max(0, Math.min(1, Number(p.value) || 0));
      slider.value = String(value);
      readout.textContent = value.toFixed(2);
      slider.title = p.origin === "service" ? `${p.service} weight ${value.toFixed(2)}` : `weight ${value.toFixed(2)}`;
    }
    const desc = card.querySelector(".desc");
    const note = p.drawing ? "drawing an icon…"
      : p.error ? p.error
      : p.origin === "service" ? `from ${p.service}`
      : p.svg ? "" : "no icon yet";
    desc.textContent = note;
    desc.classList.toggle("pending", !!p.drawing || (!p.svg && !p.error));
    const swatch = card.querySelector(".swatch");
    card.dataset.color = p.color || "";
    if (picker.card !== card) {
      swatch.style.background = p.color || "";
      swatch.classList.toggle("none", !p.color);
    }
    const icon = card.querySelector("[data-act=icon]");
    if (icon) {
      icon.disabled = !!p.drawing;
      icon.textContent = p.drawing ? "Drawing…" : "Draw icon";
    }
    const rev = String(p.svg_rev ?? "");
    if (iconRevs.get(key) !== rev) {
      iconRevs.set(key, rev);
      card.querySelector(".thumb").src = p.svg
        ? "data:image/svg+xml;charset=utf-8," + encodeURIComponent(p.svg) : EMPTY_ICON;
    }
  });
  for (const [key, card] of paramCards) if (!seen.has(key)) {
    card.remove(); paramCards.delete(key); iconRevs.delete(key);
  }
  const knobs = params.filter(p => p.editable);
  if (focusNewParam && knobs.length > knobsAtAdd) {
    const newest = knobs.sort((a, b) => b.id - a.id)[0];
    const card = newest && paramCards.get(String(newest.id));
    const input = card && card.querySelector("[data-key=prompt]");
    if (input) input.focus();
    focusNewParam = false;
  }
}

document.getElementById("add-param").onclick = () => {
  focusNewParam = true;
  knobsAtAdd = paramGrid.querySelectorAll("article [data-act=delete]").length;
  post("/api/parameters", {});
};

            <span class="bound">0.00</span>

}

function showPanel(name) {
  document.querySelectorAll(".panel-tabs button").forEach(b => b.setAttribute("aria-selected", b.dataset.panel === name));
  document.getElementById("parameters").hidden = name !== "parameters";
  document.getElementById("list").hidden = name !== "objects";
  document.getElementById("other").hidden = name !== "other";
  try { localStorage.setItem("prompts-panel", name); } catch {}
}
document.querySelectorAll(".panel-tabs button").forEach(b => b.onclick = () => showPanel(b.dataset.panel));
try {
  const t = localStorage.getItem("prompts-panel");
  if (t === "objects" || t === "other") showPanel(t);
} catch {}

async function poll() {
  try {
    const state = await (await fetch("/api/objects")).json();
    const objects = state.objects;
    lastState = state;
    render(objects);
    renderParameters(state.parameters || []);
    renderOther(state.other || []);
    renderViews(state);
    renderCombos(state.combos, objects);
    renderMusic(state.music);
    renderServices(state.services);
    renderApi(state.services);
    const models = document.getElementById("models");
    const rows = (state.models || []).map(m =>
      `<tr><td>${m.task}</td><td>${m.model}</td><td class="${m.where.startsWith("remote") ? "remote" : ""}">${m.where}</td></tr>`).join("");
    if (models.dataset.rows !== rows) { models.innerHTML = rows; models.dataset.rows = rows; }
    const live = objects.filter(o => o.in_view).length;
    const nParam = (state.parameters || []).length;
    status.textContent = `${nParam} parameters, ${objects.length} objects, ${live} in view`;
  } catch {
    status.textContent = "not connected (is sc-tracking running?)";
  }
  setTimeout(poll, 1000);
}
poll();
</script>
</body>
</html>
