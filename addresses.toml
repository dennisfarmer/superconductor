# Where the music server is. The server and the client run on the cluster, and
# the SSH tunnel puts them on this computer's localhost (superconductor_client
# README). A server on this computer uses the same ports, so there is one entry.
# The app opens `playback` and reads tempo from `http`.

[server]
input = "ws://localhost:9000/stream/input"
playback = "ws://localhost:9000/stream/playback"
http = "http://localhost:9000"
